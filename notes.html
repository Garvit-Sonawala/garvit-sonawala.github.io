<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Notes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500;1,600&family=Dancing+Script:wght@600;700&family=Work+Sans:wght@300;400;500&display=swap');

*{ box-sizing: border-box; }
html, body{ height: 100%; margin: 0; }
body{
  background: #0b0710;
  color: #f3eaf5;
  font-family: "Work Sans", ui-sans-serif, system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem;
  position: relative;
  overflow: hidden;
  transition: background 1.2s ease;
}

.gate-box{ text-align: center; position: relative; z-index: 2; }
.gate-input{
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255,255,255,0.18);
  color: #f3eaf5;
  font-family: "Work Sans", sans-serif;
  font-size: 1rem;
  text-align: center;
  padding: 0.5rem 0;
  width: 180px;
  outline: none;
}
.gate-input:focus{ border-bottom-color: rgba(255,255,255,0.5); }
.gate-hint{
  margin-top: 0.8rem;
  font-size: 0.72rem;
  color: rgba(255,255,255,0.3);
  height: 1em;
}

.bokeh{
  position: absolute;
  border-radius: 50%;
  filter: blur(50px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.4s ease;
  z-index: 0;
}
body.unlocked .bokeh{ opacity: 0.55; }
.bokeh-1{ width: 340px; height: 340px; background: #ffc2d6; top: -60px; left: -60px; }
.bokeh-2{ width: 280px; height: 280px; background: #ffe2c2; bottom: -40px; right: -40px; }
.bokeh-3{ width: 220px; height: 220px; background: #e6c8ff; top: 40%; right: 10%; }

.card{
  max-width: 620px;
  text-align: center;
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 1s ease, transform 1s ease;
  position: relative;
  z-index: 2;
  background: rgba(255,255,255,0.72);
  border: 1px solid rgba(255,255,255,0.9);
  border-radius: 22px;
  padding: 3.2rem 2.6rem;
  box-shadow: 0 30px 80px rgba(150,60,100,0.18);
}
.card.is-visible{ opacity: 1; transform: translateY(0); }

body.unlocked{
  background: linear-gradient(160deg, #fff3f6 0%, #ffe3ec 35%, #f7d6e8 65%, #ecd2f2 100%);
}

.reveal-eyebrow{
  font-family: "Playfair Display", serif;
  font-style: italic;
  font-size: 1.15rem;
  color: #b8617e;
  margin: 0 0 0.4rem 0;
}
.reveal-name{
  font-family: "Dancing Script", cursive;
  font-weight: 700;
  font-size: clamp(3rem, 9vw, 4.8rem);
  line-height: 1.1;
  margin: 0 0 1rem 0;
  color: #b23a63;
}
.reveal-flourish{
  font-size: 0.9rem;
  color: #d9a5bb;
  margin: 0 0 1.6rem 0;
  letter-spacing: 0.3em;
}

.reveal-text{
  font-family: "Work Sans", sans-serif;
  font-size: 1.05rem;
  line-height: 1.85;
  color: #6b3d4e;
  white-space: pre-wrap;
  text-align: left;
}
</style>
</head>
<body>

<div class="gate-box" id="gate-box">
  <input type="password" class="gate-input" id="gate-input" autocomplete="off" spellcheck="false">
  <p class="gate-hint" id="gate-hint">&nbsp;</p>
</div>

<div class="bokeh bokeh-1"></div>
<div class="bokeh bokeh-2"></div>
<div class="bokeh bokeh-3"></div>

<div class="card" id="card">
  <p class="reveal-eyebrow">This page is dedicated to you,</p>
  <h1 class="reveal-name" id="reveal-name"></h1>
  <p class="reveal-flourish">&#10047;</p>
  <p class="reveal-text" id="reveal-text"></p>
</div>

<script>
(function(){
  // AES-GCM ciphertext, PBKDF2-derived key (SHA-256, 150000 iterations)
  var PAYLOAD = {
    salt: "ECZeOiIlbmD0Lp2qflBwDg==",
    iv: "f42n3VWKCPh/1ZcJ",
    data: "VJvsDWN722STA0e2XjKaafplv17F9a0erERYrdOcrDBRkz8="
  };
  var NAME = "Puchku.";

  function b64ToBytes(b64){
    var bin = atob(b64);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  async function tryDecrypt(passphrase){
    var enc = new TextEncoder();
    var keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]
    );
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64ToBytes(PAYLOAD.salt), iterations: 150000, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    var plainBuf = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(PAYLOAD.iv) },
      key,
      b64ToBytes(PAYLOAD.data)
    );
    return new TextDecoder().decode(plainBuf);
  }

  var input = document.getElementById("gate-input");
  input.focus();

  input.addEventListener("keydown", async function(e){
    if (e.key !== "Enter") return;
    var hint = document.getElementById("gate-hint");
    try {
      var message = await tryDecrypt(this.value);
      document.getElementById("gate-box").remove();
      document.body.classList.add("unlocked");
      document.getElementById("reveal-name").textContent = NAME;
      document.getElementById("reveal-text").textContent = message;
      var card = document.getElementById("card");
      requestAnimationFrame(function(){ card.classList.add("is-visible"); });
    } catch (err) {
      hint.textContent = "—";
      this.value = "";
    }
  });
})();
</script>

</body>
</html>
